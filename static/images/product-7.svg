  <text x="200" y="340" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">Silk Scarf</text>
  <text x="200" y="365" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">Duo Pack</text>
  <text x="200" y="420" font-size="16" fill="#333" text-anchor="middle">Accessories</text>
